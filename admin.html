<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖管理</title>
<style>
body{padding:20px;background:#f5f5f5}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:0 auto}
button{padding:14px;width:100%;background:red;color:white;border:0;border-radius:8px}
</style>
</head>
<body>
<div class="card">
  <h2>管理后台</h2><br>
  <button onclick="clearAll()">一键清空所有出价</button>
</div>
<script>
const API = "https://auction-api-001.your-service.com";
async function clearAll(){
  if(!confirm("确定清空？"))return;
  await fetch(API+"/clear", {method:"POST"});
  alert("已清空！");
}
</script>
</body>
</html>
