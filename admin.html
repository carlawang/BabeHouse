<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖后台</title>
<style>
body{padding:20px;background:#f5f5f5}
input,button{width:100%;padding:12px;margin:6px 0}
.card{background:white;padding:20px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
<h2>拍卖后台管理</h2>
<input id="img" placeholder="商品图片链接">
<input id="title" placeholder="商品标题">
<input id="intro" placeholder="商品介绍（起拍价）">
<button onclick="save()">保存设置</button>
</div>
<script>
const KEY="myauctionconfig";
function save(){
    let img=document.getElementById("img").value;
    let title=document.getElementById("title").value;
    let intro=document.getElementById("intro").value;
    localStorage.setItem(KEY,JSON.stringify({img,title,intro}));
    alert("保存成功！拍卖页已同步");
}
</script>
</body>
</html>
