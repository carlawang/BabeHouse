<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖管理后台</title>
<style>
body{padding:20px;background:#f5f5f5;font-family:Arial}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:0 auto}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd}
button{background:#007AFF;color:#fff;border:0}
.clear{background:#ff3b30}
</style>
</head>
<body>
<div class="card">
  <h2>拍卖管理后台</h2>
  <input id="img" placeholder="商品图片链接">
  <input id="title" placeholder="商品标题">
  <input id="intro" placeholder="商品介绍/起拍价">
  <button onclick="save()">保存商品信息</button>
  <button class="clear" onclick="clearAll()">🔴 一键清空所有出价数据</button>
</div>

<script src="https://imgcache.qq.com/qcloud/tcbjs/1.13.6/tcb-js-sdk.min.js"></script>
<script>
const app = tcb.init({
  env: "babehouse-7g2pol15cd8980c7",
  secretId: "AKID2GG3buzqTrBKGyRq8C3g5FAtPineJl02",
  secretKey: "xiFZgbIn6B2jDTUJ4nQp1zlKekeLp58z"
});
const db = app.database();
const _ = db.command;

async function save(){
  let img = document.getElementById("img").value;
  let title = document.getElementById("title").value;
  let intro = document.getElementById("intro").value;
  await db.collection("config").doc("info").set({img,title,intro});
  alert("保存成功！拍卖页已同步");
}

async function clearAll(){
  if(!confirm("确定要清空所有出价、用户名、排行吗？不可恢复！"))return;
  await db.collection("auction").where(_.exists(true)).remove();
  alert("✅ 已清空所有拍卖数据！");
}
</script>
</body>
</html>
