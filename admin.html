<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖后台</title>
<style>
body{padding:20px;background:#f5f5f5}
.card{background:#fff;padding:20px;border-radius:12px;max-width:500px;margin:0 auto}
button{width:100%;padding:14px;background:red;color:#fff;border:none;border-radius:8px;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <h2>拍卖管理后台</h2>
  <br>
  <button onclick="clearAll()">一键清空所有出价</button>
</div>
<script>
function clearAll() {
  if (!confirm("确定清空所有数据？")) return;
  fetch("https://script.google.com/macros/s/AKfycbz9z9z9z9z9z9z9z9z9z9z9z9z9z9z9z9/exec?clear=1", {
    mode: "no-cors"
  });
  alert("已清空！");
}
</script>
</body>
</html>
