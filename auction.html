<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BabeHouse 实时拍卖</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:Avenir,Arial;padding:15px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
button{width:100%;padding:12px;background:#007AFF;color:#fff;border:none;border-radius:8px}
.rank-item{padding:10px;border-bottom:1px solid #f0f0f0}
</style>
</head>
<body>

<div class="card">
  <h2>🏆 BabeHouse 实时拍卖</h2>
</div>

<div class="card">
  <input id="user" placeholder="输入你的名字">
  <button onclick="setUser()">设置用户名</button>
  <div style="font-size:12px;margin-top:6px">当前：<span id="showUser"></span></div>
</div>

<div class="card">
  <h3 id="goods">精品拍卖</h3>
  <p style="color:#666">起拍价：100</p>
</div>

<div class="card">
  <input type="number" id="price" min="100" placeholder="输入出价">
  <button onclick="submit()">提交报价</button>
</div>

<div class="card">
  <h3>实时排行</h3>
  <div id="list"></div>
</div>

<script>
let tableUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1lYzFnkO4Cf66U1Lr1n8M0h0Jb9a7rQaKt6kK7t6t6t6t6t6t6t6t6t6t6t6t6t6t6/pub?output=csv";
let userName = localStorage.getItem("user");
if (userName) document.getElementById("showUser").innerText = userName;

function setUser() {
  let u = document.getElementById("user").value.trim();
  if (!u) return alert("请输入名字");
  userName = u;
  localStorage.setItem("user", u);
  document.getElementById("showUser").innerText = u;
}

async function submit() {
  if (!userName) return alert("先设置名字");
  let p = parseInt(document.getElementById("price").value);
  if (!p || p < 100) return alert("价格≥100");

  await fetch("https://script.google.com/macros/s/AKfycbz9z9z9z9z9z9z9z9z9z9z9z9z9z9z9z9/exec", {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({ name: userName, price: p })
  });

  alert("出价成功！");
  loadList();
}

async function loadList() {
  let res = await fetch(tableUrl);
  let text = await res.text();
  let rows = text.split("\n").slice(1).filter(i => i);
  let list = rows.map(r => {
    let [name, price] = r.split(",");
    return { name, price: parseInt(price) };
  });
  list.sort((a, b) => b.price - a.price);

  let html = "";
  list.forEach((it, i) => {
    let m = ["🥇", "🥈", "🥉"][i] || "";
    html += `<div class="rank-item">${m} ${it.name} ￥${it.price}</div>`;
  });
  document.getElementById("list").innerHTML = html || "<div>暂无出价</div>";
}

setInterval(loadList, 3000);
window.onload = loadList;
</script>
</body>
</html>
