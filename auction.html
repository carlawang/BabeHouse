<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍卖系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:Arial;padding:20px;max-width:600px;margin:auto}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:12px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
button{width:100%;padding:12px;background:#007AFF;color:white;border:none;border-radius:8px}
img{width:100%;border-radius:8px}
.rank{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>

<div class="card"><h2>拍卖大厅</h2></div>

<div class="card">
  <input id="user" placeholder="输入用户名">
  <button onclick="setUser()">保存/修改</button>
  当前：<b id="showUser"></b>
</div>

<div class="card">
  <h3 id="title">商品名</h3>
  <img id="img" src="https://picsum.photos/600/400">
  <p id="desc" style="color:#666">商品描述</p>
</div>

<div class="card">
  <input type="number" id="price" placeholder="出价">
  <button onclick="bid()">提交出价</button>
</div>

<div class="card">
  <h3>实时前三名</h3>
  <div id="top3"></div>
</div>

<script>
const channel = "YOUR_CHANNEL_ID";
const pushUrl = "https://push.livewire.to/push";
const pullUrl = "https://push.livewire.to/pull";

function setUser(){
  let u = document.getElementById("user").value.trim();
  if(!u)return;
  localStorage.setItem("user",u);
  document.getElementById("showUser").innerText = u;
}

async function bid(){
  let user = localStorage.getItem("user");
  let price = parseInt(document.getElementById("price").value);
  if(!user || !price)return alert("请填写完整");
  
  let res = await fetch(pullUrl + "?channel=" + channel);
  let list = await res.json() || [];
  
  let idx = list.findIndex(x=>x.name==user);
  if(idx>=0) list[idx].price=price;
  else list.push({name:user,price:price});
  
  await fetch(pushUrl,{
    method:"POST",
    body:JSON.stringify({channel,data:list})
  });
  alert("出价成功");
  loadTop();
}

async function loadTop(){
  let res = await fetch(pullUrl + "?channel=" + channel);
  let list = await res.json() || [];
  list.sort((a,b)=>b.price-a.price);
  let top3 = list.slice(0,3);
  let html = "";
  top3.forEach((it,i)=>{
    let m=["🥇","🥈","🥉"][i];
    html+=`<div class="rank">${m} ${it.name} ￥${it.price}</div>`;
  });
  document.getElementById("top3").innerHTML = html || "暂无出价";
}

setInterval(loadTop,2000);
window.onload=()=>{
  document.getElementById("showUser").innerText=localStorage.getItem("user")||"";
  loadTop();
};
</script>
</body>
</html>
