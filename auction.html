<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公开拍卖系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:Arial;padding:15px;max-width:600px;margin:0 auto}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000015}
h2{font-size:18px;margin-bottom:10px;color:#333}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
button{width:100%;padding:12px;background:#2d9cdb;color:white;border:none;border-radius:8px;font-size:16px;margin-top:5px}
.goods-img{width:100%;height:auto;border-radius:8px;margin:10px 0}
.rank-item{padding:10px;border-bottom:1px solid #f0f0f0}
.rank-item:last-child{border-bottom:none}
.tip{font-size:12px;color:#888;margin-top:5px}
</style>
</head>
<body>

<div class="card">
<h2>🏆 拍卖系统</h2>
</div>

<div class="card">
<input id="username" placeholder="输入用户名（可随时改）">
<button onclick="saveUser()">设置 / 修改用户名</button>
<div class="tip">当前：<span id="userText">未设置</span></div>
</div>

<div class="card">
<img class="goods-img" id="goodImg" src="https://picsum.photos/600/400">
<h2 id="goodTitle">拍卖商品：精品</h2>
<p id="goodIntro">起拍价：100元</p>
</div>

<div class="card">
<h2>我要出价</h2>
<input id="price" type="number" placeholder="请输入出价" min="100">
<button onclick="sendBid()">提交出价</button>
<div class="tip">可多次出价，自动更新</div>
</div>

<div class="card">
<h2>🔥 当前出价前三名</h2>
<div id="rankList"></div>
</div>

<script>
const KEY = "myauctionconfig";
function $(id){return document.getElementById(id)}

function saveUser(){
    let v = $("username").value.trim();
    if(!v)return alert("请输入用户名");
    localStorage.setItem("user",v);
    $("userText").innerText = v;
}

async function sendBid(){
    let user = localStorage.getItem("user");
    if(!user)return alert("先设置用户名");
    let p = $("price").value.trim();
    if(!p || p<100)return alert("价格不能低于100");
    
    let bids = JSON.parse(localStorage.getItem("bids")||"[]");
    let index = bids.findIndex(i=>i.name===user);
    if(index>-1) bids[index].price=+p;
    else bids.push({name:user,price:+p});
    localStorage.setItem("bids",JSON.stringify(bids));
    $("price").value="";
    showRank();
}

function showRank(){
    let bids = JSON.parse(localStorage.getItem("bids")||"[]");
    bids.sort((a,b)=>b.price-a.price);
    let top3 = bids.slice(0,3);
    let html="";
    if(top3.length===0)html="<div class='rank-item'>暂无出价</div>";
    else top3.forEach((it,i)=>{
        let medal=["🥇","🥈","🥉"][i];
        html+=`<div class='rank-item'>${medal} ${it.name} ￥${it.price}</div>`;
    });
    $("rankList").innerHTML=html;
}

function loadConfig(){
    let cfg=JSON.parse(localStorage.getItem(KEY)||'{"img":"","title":"","intro":""}');
    if(cfg.img)$("goodImg").src=cfg.img;
    if(cfg.title)$("goodTitle").innerText=cfg.title;
    if(cfg.intro)$("goodIntro").innerText=cfg.intro;
}

window.onload=()=>{
    let u=localStorage.getItem("user");
    if(u)$("userText").innerText=u;
    loadConfig();
    showRank();
}
</script>
</body>
</html>
